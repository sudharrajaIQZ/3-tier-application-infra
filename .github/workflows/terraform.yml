name: "Terraform 3 tier infra"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  terraform_pipeline:
    name: "Execute Terraform Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: action/Checkout@v4

      - name: Install and Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Initialize
        run: terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{secrets.AWS_REGION}}

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan --auto-approve
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{secrets.AWS_REGION}}

  terraform_pipeline_destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest

    # check which branch is running
    if: github.ref == 'refs/head/destroy' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Source Code for destroy
        uses: action/Checkout@v4

      - name: Install and Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform destroy
        run: terraform destroy --auto-approve
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{secrets.AWS_REGION}}
