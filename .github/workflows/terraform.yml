name: "three tier terraform infra setup"

on:
  push:
    branches:
      - Dev
      - Stage
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select the environment to deploy"
        default: "Development"
        required: true

      operations:
        description: "Select the operations to run"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform_build:
    name: "Terraform build for ${{ github.ref.heads }} environment"
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && contains(fromJson( '["master","Dev","Stage"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'Development' && github.event.inputs.operations == 'apply')

    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      AWS_ACCESS_PROFILE: ${{ secrets.AWS_PROFILE_NAME }}
      AWS_ACCESS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ACCESS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install and Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Apply alias for terraform
        run: alias tf=terraform

      - name: Terraform Initialize
        run: tf init -backend-config="key=${{github.event.inputs.environment}}/terraform.tfstate" -upgrade

      - name: Terraform Validate
        run: tf validate

      - name: Terraform Plan
        run: tf plan -out=tfplan

      - name: Terraform Apply
        run: tf apply 'tfplan' --auto-approve
        # env:
        #   GITHUB_ACCESS_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        #   AWS_ACCESS_PROFILE: ${{ secrets.AWS_PROFILE_NAME }}
        #   AWS_ACCESS_REGION: ${{ secrets.AWS_REGION }}
        #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   AWS_ACCESS_SECRET_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}

  terraform_destroy:
    name: "Terraform destroy for ${{github.ref.heads}} environment"
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/Stage' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'Development' && github.event.inputs.operations == 'destroy')

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Apply alias for terraform
        run: alias tf=terraform

      - name: Terraform Initialize
        run: tf init -upgrade

      - name: Terraform Destroy
        run: tf destroy --auto-approve
